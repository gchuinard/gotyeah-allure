# Serves the generated unified Allure report (static). Sits behind Nginx Proxy
# Manager + Cloudflare Access (One-time PIN) — no auth here on purpose.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allure 2 navigates with #fragments: every real URL is a file of the report,
    # so no index.html fallback. An unknown path gets a real 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Custom 404 page. It lives OUTSIDE the report dir, which the generator empties
    # and refills on every run (see docker-compose.yml). No "=": the status stays 404.
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/errors;
        internal;
    }

    # Its stylesheet: a separate file, so the page needs no inline style.
    location = /404.css {
        root /usr/share/nginx/errors;
    }

    # Lightweight liveness endpoint for NPM / compose healthchecks.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
