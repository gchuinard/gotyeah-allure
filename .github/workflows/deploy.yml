name: Deploy Allure dashboard to Pi

on:
  push:
    branches: [main]
    paths:
      - "pi/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-allure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Depuis le 25/09/2026, la clé DEPLOY_SSH_KEY est dédiée à ce dépôt. Sur le Pi,
      # authorized_keys la force sur « /usr/local/sbin/gotyeah-deploy allure » : le Pi met à
      # jour sa copie de ce dépôt (public), puis lance deploy/pi-deploy.sh, qui recopie pi/
      # dans le dossier du service et reconstruit. La commande envoyée ici est ignorée.
      # Les clés d'hôte du Pi viennent du secret SSH_KNOWN_HOSTS (alias pi-gotyeah) : en clair
      # dans ce dépôt public, elles permettraient de retrouver l'adresse du Pi.
      - name: Déployer sur le Pi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for v in SSH_HOST SSH_USER DEPLOY_SSH_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v absent."; exit 1; fi
          done
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts_pi
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o HostKeyAlias=pi-gotyeah \
            -o UserKnownHostsFile=~/.ssh/known_hosts_pi -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" deploy
